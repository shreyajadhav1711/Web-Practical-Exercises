<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2: Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            margin: 40px auto;
            max-width: 450px;
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4a5568;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border-color: #3182ce;
        }
        .submit-btn {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #2b6cb0;
        }
        .hint-text {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Register Account</h2>
        <form id="registrationForm" onsubmit="return validateForm(event)">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="userEmail">Email Address</label>
                <input type="email" id="userEmail" placeholder="name@example.com">
            </div>
            <button type="submit" 
                    class="submit-btn" 
                    onclick="handleClick()" 
                    onmouseover="handleMouseOver()">
                Submit Registration
            </button>
            <p id="eventHint" class="hint-text" style="text-align: center; display: none;">
               You hovered over the submit button!
            </p>
        </form>
    </div>
    <script>
        function handleMouseOver() {
            document.getElementById("eventHint").style.display = "block";
            console.log("Mouse pointer hovered over the submit button.");
        }
        function handleClick() {
            console.log("Submit button clicked. Initializing evaluation flow...");
        }
        function validateForm(event) {
            const nameInput = document.getElementById("fullName").value.trim();
            const emailInput = document.getElementById("userEmail").value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (nameInput === "") {
                alert(" Validation Error: Name field cannot be empty!");
                event.preventDefault(); 
                return false;
            }
            if (nameInput.length < 3) {
                alert(" Validation Error: Name must be at least 3 characters long!");
                event.preventDefault(); 
                return false;
            }
            if (emailInput === "") {
                alert(" Validation Error: Email field cannot be empty!");
                event.preventDefault();
                return false;
            }
            if (!emailPattern.test(emailInput)) {
                alert(" Validation Error: Please enter a valid email format (e.g., name@example.com)!");
                event.preventDefault();
                return false;
            }
            alert(" Success! Your registration form passed validation and was submitted successfully.");
            return true;
        }
    </script>
</body>
</html>
